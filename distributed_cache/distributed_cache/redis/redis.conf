# Redis configuration for the distributed cache.
#
# Requires Redis 8+ (from https://packages.redis.io/deb), which ships the
# JSON data type built in -- no `loadmodule rejson.so` needed. The cache
# server uses JSON.* commands, which fail on older Redis builds.
#
# Install:
#   sudo apt-get install -y redis
#
# Start with:
#   redis-server /path/to/redis/redis.conf

################################ NETWORK #####################################

bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-keepalive 300

################################# GENERAL ####################################

daemonize no
loglevel notice
logfile ""
databases 16

################################# MODULES ####################################

# Redis 8+ has JSON built in. If you ever run an older Redis that needs the
# external RedisJSON module, uncomment and point at the actual rejson.so:
# loadmodule /path/to/rejson.so

################################ PERSISTENCE #################################

# This service is a cache; persistence is intentionally minimal. Flip to
# `appendonly yes` if you ever need durability.
save ""
appendonly no

################################ MEMORY ######################################

# maxmemory 256mb
maxmemory-policy allkeys-lru
