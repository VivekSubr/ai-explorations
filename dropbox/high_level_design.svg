<svg width="100%" viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">High level design for Dropbox-like storage</title>
  <desc id="desc">Architecture diagram showing clients authenticating with Google SSO, calling gateway load balancers, reaching backend server pods, and storing metadata in Postgres while file bytes are stored in NFS-backed object storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; }
      .client { fill: #e8f3ff; stroke: #2474b8; }
      .auth { fill: #fff4df; stroke: #b7791f; }
      .edge { fill: #edf7f2; stroke: #207a5a; }
      .compute { fill: #eef2ff; stroke: #4f5fb8; }
      .data { fill: #f0f9ff; stroke: #1680a7; }
      .store { fill: #ecfdf3; stroke: #17803f; }
      .note { fill: #fff7ed; stroke: #c56b1d; }
      .label { fill: #0f172a; font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .small { fill: #334155; font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .tiny { fill: #64748b; font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; }
      .title { fill: #0f172a; font-family: "Segoe UI", Arial, sans-serif; font-size: 26px; font-weight: 700; }
      .subtitle { fill: #475569; font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-strong { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrow); }
      .arrow-data { fill: none; stroke: #0f766e; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-dashed { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="720" rx="0"/>
  <text class="title" x="60" y="58">Dropbox-Like Storage: High Level Design</text>
  <text class="subtitle" x="60" y="84">Highly available file upload, download, sharing, and sync with metadata separated from file bytes.</text>

  <rect class="lane" x="50" y="120" width="220" height="430" rx="12" filter="url(#shadow)"/>
  <text class="label" x="80" y="154">Users and devices</text>
  <text class="tiny" x="80" y="176">Qt client rebuilt per platform</text>

  <g>
    <rect class="client" x="85" y="215" width="150" height="64" rx="10"/>
    <text class="label" x="160" y="241" text-anchor="middle">Desktop</text>
    <text class="small" x="160" y="261" text-anchor="middle">sync folder</text>
  </g>
  <g>
    <rect class="client" x="85" y="310" width="150" height="64" rx="10"/>
    <text class="label" x="160" y="336" text-anchor="middle">Mobile</text>
    <text class="small" x="160" y="356" text-anchor="middle">upload/download</text>
  </g>
  <g>
    <rect class="client" x="85" y="405" width="150" height="64" rx="10"/>
    <text class="label" x="160" y="431" text-anchor="middle">Other device</text>
    <text class="small" x="160" y="451" text-anchor="middle">shared files</text>
  </g>

  <rect class="lane" x="325" y="120" width="240" height="430" rx="12" filter="url(#shadow)"/>
  <text class="label" x="355" y="154">Access layer</text>
  <text class="tiny" x="355" y="176">SSO, bearer tokens, routing</text>

  <g>
    <rect class="auth" x="365" y="215" width="160" height="72" rx="10"/>
    <text class="label" x="445" y="243" text-anchor="middle">Google SSO</text>
    <text class="small" x="445" y="264" text-anchor="middle">SDK / OAuth2</text>
  </g>
  <g>
    <rect class="edge" x="345" y="372" width="200" height="82" rx="10"/>
    <text class="label" x="445" y="402" text-anchor="middle">Gateway</text>
    <text class="small" x="445" y="424" text-anchor="middle">load balancer</text>
    <text class="tiny" x="445" y="443" text-anchor="middle">least requests + ID-token hash</text>
  </g>

  <rect class="lane" x="620" y="120" width="230" height="430" rx="12" filter="url(#shadow)"/>
  <text class="label" x="650" y="154">Backend service</text>
  <text class="tiny" x="650" y="176">Server pods spread across nodes</text>

  <g>
    <rect class="compute" x="650" y="220" width="170" height="70" rx="10"/>
    <text class="label" x="735" y="247" text-anchor="middle">Server pod A</text>
    <text class="small" x="735" y="268" text-anchor="middle">API handlers</text>
  </g>
  <g>
    <rect class="compute" x="650" y="325" width="170" height="70" rx="10"/>
    <text class="label" x="735" y="352" text-anchor="middle">Server pod B</text>
    <text class="small" x="735" y="373" text-anchor="middle">upload sessions</text>
  </g>
  <g>
    <rect class="compute" x="650" y="430" width="170" height="70" rx="10"/>
    <text class="label" x="735" y="457" text-anchor="middle">Server pod N</text>
    <text class="small" x="735" y="478" text-anchor="middle">share + sync</text>
  </g>

  <rect class="lane" x="905" y="120" width="145" height="430" rx="12" filter="url(#shadow)"/>
  <text class="label" x="928" y="154">Data layer</text>
  <text class="tiny" x="928" y="176">metadata + bytes</text>

  <g>
    <path class="data" d="M930 225 C930 208 1025 208 1025 225 L1025 285 C1025 302 930 302 930 285 Z"/>
    <ellipse class="data" cx="977.5" cy="225" rx="47.5" ry="17"/>
    <text class="label" x="977" y="253" text-anchor="middle">Postgres</text>
    <text class="small" x="977" y="273" text-anchor="middle">metadata DB</text>
  </g>
  <g>
    <path class="store" d="M930 395 C930 378 1025 378 1025 395 L1025 470 C1025 487 930 487 930 470 Z"/>
    <ellipse class="store" cx="977.5" cy="395" rx="47.5" ry="17"/>
    <text class="label" x="977" y="425" text-anchor="middle">NFS</text>
    <text class="small" x="977" y="445" text-anchor="middle">object store</text>
    <text class="tiny" x="977" y="464" text-anchor="middle">PV/PVC pool</text>
  </g>

  <path class="arrow" d="M235 247 C280 247 315 247 365 247"/>
  <text class="tiny" x="300" y="235" text-anchor="middle">sign in</text>

  <path class="arrow-dashed" d="M365 272 C310 310 275 350 235 410"/>
  <text class="tiny" x="303" y="346" text-anchor="middle">bearer token</text>

  <path class="arrow-strong" d="M235 435 C285 435 305 413 345 413"/>
  <text class="tiny" x="291" y="456" text-anchor="middle">API calls + token</text>

  <path class="arrow-strong" d="M545 413 C580 413 605 395 650 365"/>
  <text class="tiny" x="597" y="388" text-anchor="middle">route request</text>

  <path class="arrow-data" d="M820 255 C860 255 890 255 930 255"/>
  <text class="tiny" x="874" y="241" text-anchor="middle">users, files, shares</text>

  <path class="arrow-data" d="M820 465 C865 465 890 448 930 435"/>
  <text class="tiny" x="873" y="486" text-anchor="middle">file bytes</text>

  <path class="arrow-dashed" d="M930 292 C890 330 862 354 820 360"/>
  <text class="tiny" x="884" y="333" text-anchor="middle">metadata lookup</text>

  <path class="arrow-dashed" d="M930 410 C890 395 862 375 820 360"/>
  <text class="tiny" x="878" y="397" text-anchor="middle">read/write chunks</text>

  <rect class="note" x="80" y="595" width="940" height="70" rx="12"/>
  <text class="label" x="110" y="623">Important flows</text>
  <text class="small" x="110" y="647">Upload: client starts or resumes an upload session, sends chunks through the gateway, and backend stores bytes in NFS while updating metadata.</text>
  <text class="small" x="110" y="667">Download/sync/share: client lists metadata, downloads bytes with resume support, and uses share records to expose files to other users.</text>
</svg>