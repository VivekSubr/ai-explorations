<svg width="100%" viewBox="0 0 1120 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">API design for Dropbox-like storage</title>
  <desc id="desc">Diagram of the API contract showing bearer-authenticated client requests passing through the gateway into folder, file, upload, and user handlers, which write metadata to Postgres and file bytes to NFS-backed object storage.</desc>
  <defs>
    <marker id="api-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; filter: url(#card-shadow); }
      .client { fill: #e8f3ff; stroke: #2474b8; }
      .gateway { fill: #edf7f2; stroke: #207a5a; }
      .resource { fill: #eef2ff; stroke: #4f5fb8; }
      .upload { fill: #fff7ed; stroke: #c56b1d; }
      .data { fill: #f0f9ff; stroke: #1680a7; }
      .store { fill: #ecfdf3; stroke: #17803f; }
      .status { fill: #fefce8; stroke: #a16207; }
      .title { fill: #0f172a; font-family: "Segoe UI", Arial, sans-serif; font-size: 26px; font-weight: 700; }
      .subtitle { fill: #475569; font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; }
      .label { fill: #0f172a; font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .small { fill: #334155; font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .tiny { fill: #64748b; font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; }
      .method { fill: #ffffff; font-family: "Segoe UI", Arial, sans-serif; font-size: 10px; font-weight: 700; }
      .get { fill: #2563eb; }
      .post { fill: #15803d; }
      .put { fill: #c2410c; }
      .patch { fill: #7c3aed; }
      .delete { fill: #be123c; }
      .head { fill: #0f766e; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#api-arrow); }
      .arrow-strong { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#api-arrow); }
      .arrow-data { fill: none; stroke: #0f766e; stroke-width: 2.2; marker-end: url(#api-arrow); }
      .arrow-dashed { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#api-arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="780"/>
  <text class="title" x="60" y="58">Dropbox-Like Storage: API Design</text>
  <text class="subtitle" x="60" y="84">Bearer-authenticated HTTP API grouped around folders, files, resumable uploads, users, and sharing.</text>

  <rect class="card" x="50" y="125" width="235" height="440" rx="12"/>
  <text class="label" x="80" y="160">Qt API client</text>
  <text class="tiny" x="80" y="181">Desktop, mobile, sync engine</text>
  <g>
    <rect class="client" x="78" y="220" width="180" height="70" rx="10"/>
    <text class="label" x="168" y="247" text-anchor="middle">Request builder</text>
    <text class="small" x="168" y="269" text-anchor="middle">paths, headers, bodies</text>
  </g>
  <g>
    <rect class="client" x="78" y="318" width="180" height="70" rx="10"/>
    <text class="label" x="168" y="345" text-anchor="middle">Auth header</text>
    <text class="small" x="168" y="367" text-anchor="middle">Authorization: Bearer token</text>
  </g>
  <g>
    <rect class="client" x="78" y="416" width="180" height="78" rx="10"/>
    <text class="label" x="168" y="444" text-anchor="middle">Transfer behavior</text>
    <text class="small" x="168" y="466" text-anchor="middle">redirects, retries, ranges</text>
    <text class="tiny" x="168" y="484" text-anchor="middle">256 KiB-aligned upload chunks</text>
  </g>

  <rect class="card" x="340" y="125" width="210" height="440" rx="12"/>
  <text class="label" x="370" y="160">Gateway boundary</text>
  <text class="tiny" x="370" y="181">External API entry point</text>
  <g>
    <rect class="gateway" x="370" y="255" width="150" height="92" rx="10"/>
    <text class="label" x="445" y="286" text-anchor="middle">Gateway</text>
    <text class="small" x="445" y="308" text-anchor="middle">validates token</text>
    <text class="small" x="445" y="328" text-anchor="middle">routes by user hash</text>
  </g>
  <g>
    <rect class="status" x="370" y="410" width="150" height="78" rx="10"/>
    <text class="label" x="445" y="438" text-anchor="middle">Responses</text>
    <text class="small" x="445" y="460" text-anchor="middle">200, 201, 206, 308</text>
    <text class="small" x="445" y="479" text-anchor="middle">302, 307, 403, 404</text>
  </g>

  <rect class="card" x="605" y="125" width="250" height="440" rx="12"/>
  <text class="label" x="635" y="160">API resources</text>
  <text class="tiny" x="635" y="181">Handlers implemented by server pods</text>

  <g>
    <rect class="resource" x="635" y="215" width="190" height="78" rx="10"/>
    <text class="label" x="730" y="240" text-anchor="middle">/files</text>
    <rect class="get" x="660" y="257" width="34" height="18" rx="4"/><text class="method" x="677" y="270" text-anchor="middle">GET</text>
    <rect class="post" x="704" y="257" width="40" height="18" rx="4"/><text class="method" x="724" y="270" text-anchor="middle">POST</text>
    <rect class="delete" x="754" y="257" width="52" height="18" rx="4"/><text class="method" x="780" y="270" text-anchor="middle">DELETE</text>
    <text class="tiny" x="730" y="288" text-anchor="middle">folder listing and folder lifecycle</text>
  </g>

  <g>
    <rect class="resource" x="635" y="323" width="190" height="100" rx="10"/>
    <text class="label" x="730" y="347" text-anchor="middle">/file</text>
    <rect class="head" x="650" y="365" width="42" height="18" rx="4"/><text class="method" x="671" y="378" text-anchor="middle">HEAD</text>
    <rect class="get" x="700" y="365" width="34" height="18" rx="4"/><text class="method" x="717" y="378" text-anchor="middle">GET</text>
    <rect class="post" x="742" y="365" width="40" height="18" rx="4"/><text class="method" x="762" y="378" text-anchor="middle">POST</text>
    <rect class="put" x="650" y="391" width="34" height="18" rx="4"/><text class="method" x="667" y="404" text-anchor="middle">PUT</text>
    <rect class="patch" x="692" y="391" width="48" height="18" rx="4"/><text class="method" x="716" y="404" text-anchor="middle">PATCH</text>
    <rect class="delete" x="748" y="391" width="52" height="18" rx="4"/><text class="method" x="774" y="404" text-anchor="middle">DELETE</text>
    <text class="tiny" x="730" y="418" text-anchor="middle">metadata, bytes, uploads, delete</text>
  </g>

  <g>
    <rect class="upload" x="635" y="453" width="190" height="78" rx="10"/>
    <text class="label" x="730" y="478" text-anchor="middle">/user and /user/share</text>
    <rect class="get" x="658" y="495" width="34" height="18" rx="4"/><text class="method" x="675" y="508" text-anchor="middle">GET</text>
    <rect class="post" x="702" y="495" width="40" height="18" rx="4"/><text class="method" x="722" y="508" text-anchor="middle">POST</text>
    <rect class="delete" x="752" y="495" width="52" height="18" rx="4"/><text class="method" x="778" y="508" text-anchor="middle">DELETE</text>
    <text class="tiny" x="730" y="526" text-anchor="middle">users, assignment, sharing</text>
  </g>

  <rect class="card" x="910" y="125" width="160" height="440" rx="12"/>
  <text class="label" x="935" y="160">Persistence</text>
  <text class="tiny" x="935" y="181">Separation of concerns</text>
  <g>
    <path class="data" d="M938 235 C938 218 1042 218 1042 235 L1042 310 C1042 327 938 327 938 310 Z"/>
    <ellipse class="data" cx="990" cy="235" rx="52" ry="17"/>
    <text class="label" x="990" y="264" text-anchor="middle">Postgres</text>
    <text class="small" x="990" y="285" text-anchor="middle">metadata</text>
    <text class="tiny" x="990" y="304" text-anchor="middle">users, shares, sessions</text>
  </g>
  <g>
    <path class="store" d="M938 405 C938 388 1042 388 1042 405 L1042 495 C1042 512 938 512 938 495 Z"/>
    <ellipse class="store" cx="990" cy="405" rx="52" ry="17"/>
    <text class="label" x="990" y="436" text-anchor="middle">NFS store</text>
    <text class="small" x="990" y="457" text-anchor="middle">file bytes</text>
    <text class="tiny" x="990" y="476" text-anchor="middle">per-user folders</text>
    <text class="tiny" x="990" y="493" text-anchor="middle">PV/PVC backed</text>
  </g>

  <path class="arrow-strong" d="M258 353 C295 353 325 312 370 302"/>
  <text class="tiny" x="314" y="318" text-anchor="middle">HTTP + bearer token</text>

  <path class="arrow-strong" d="M520 302 C555 302 590 265 635 254"/>
  <text class="tiny" x="580" y="272" text-anchor="middle">/files</text>
  <path class="arrow-strong" d="M520 312 C555 312 590 372 635 373"/>
  <text class="tiny" x="581" y="351" text-anchor="middle">/file</text>
  <path class="arrow-strong" d="M520 322 C555 322 590 490 635 492"/>
  <text class="tiny" x="582" y="453" text-anchor="middle">/user</text>

  <path class="arrow-data" d="M825 255 C865 255 900 263 938 270"/>
  <text class="tiny" x="882" y="245" text-anchor="middle">folder metadata</text>
  <path class="arrow-data" d="M825 372 C870 364 898 335 938 295"/>
  <text class="tiny" x="884" y="346" text-anchor="middle">file metadata</text>
  <path class="arrow-data" d="M825 492 C868 484 900 320 938 300"/>
  <text class="tiny" x="891" y="444" text-anchor="middle">users and shares</text>

  <path class="arrow-data" d="M825 392 C870 398 900 426 938 445"/>
  <text class="tiny" x="884" y="419" text-anchor="middle">bytes and chunks</text>
  <path class="arrow-dashed" d="M938 468 C880 512 830 522 825 522"/>
  <text class="tiny" x="881" y="535" text-anchor="middle">download stream</text>

  <path class="arrow-dashed" d="M370 450 C300 540 235 540 168 494"/>
  <text class="tiny" x="270" y="548" text-anchor="middle">JSON, headers, redirects, partial content, errors</text>

  <rect class="status" x="80" y="615" width="960" height="88" rx="12"/>
  <text class="label" x="110" y="644">Contract summary</text>
  <text class="small" x="110" y="669">/files returns folder trees and creates/deletes folders. /file separates HEAD metadata, GET bytes, POST small uploads or resumable session creation, PUT chunks, PATCH metadata, and DELETE file removal.</text>
  <text class="small" x="110" y="691">/user creates, reads, and deletes user records; /user/share grants folder access. Common failures are 403 forbidden and 404 not found.</text>
</svg>