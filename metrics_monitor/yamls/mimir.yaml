apiVersion: v1
kind: Namespace
metadata:
  name: mimir-example
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: mimir-example
data:
  config.yaml: |
    target: all
    multitenancy_enabled: false

    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
      log_level: warn

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /mimir/blocks
      bucket_store:
        sync_dir: /mimir/bucket-sync
      tsdb:
        dir: /mimir/tsdb
        flush_blocks_on_shutdown: true

    compactor:
      data_dir: /mimir/compactor
      sharding_ring:
        kvstore:
          store: inmemory

    distributor:
      ring:
        kvstore:
          store: inmemory

    ingester:
      ring:
        replication_factor: 1
        kvstore:
          store: inmemory

    querier:
      ring:
        kvstore:
          store: inmemory

    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: inmemory

    ruler:
      rule_path: /mimir/ruler
      ring:
        kvstore:
          store: inmemory

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /mimir/ruler-storage

    limits:
      ingestion_rate: 100000
      ingestion_burst_size: 200000
      max_global_series_per_user: 0
      promote_otel_resource_attributes: service.name,service.version,deployment.environment,k8s.namespace.name,k8s.pod.name,k8s.node.name

    usage_stats:
      enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: mimir-example
  labels:
    app: mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:3.1.2
          args:
            - -config.file=/etc/mimir/config.yaml
          ports:
            - name: http
              containerPort: 9009
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
              readOnly: true
            - name: data
              mountPath: /mimir
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: mimir-example
  labels:
    app: mimir
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 9009
      targetPort: http
    - name: grpc
      port: 9095
      targetPort: grpc